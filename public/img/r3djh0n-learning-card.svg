<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <pattern id="grid2" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#a78bfa" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <rect width="800" height="450" fill="url(#grid2)"/>
  <text x="40" y="60" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">R3DJH0N_LEARNING</text>
  <text x="40" y="86" font-family="Inter, Arial, sans-serif" font-size="14" fill="#c4b5fd">Cuaderno CTF • Labs • Tools • Obsidian</text>
  <!-- folders -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="40" y="130" width="220" height="110" rx="12" fill="#0e1420" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="60" y="162" font-size="24">🚩</text>
    <text x="60" y="186" font-size="14" font-weight="bold" fill="#fff">ctf/ + labs/</text>
    <text x="60" y="206" font-size="11" fill="#c4b5fd">Fluid • Web • Forense</text>
    <text x="60" y="222" font-size="11" fill="#c4b5fd">TryHackMe • HackTheBox</text>
    <rect x="290" y="130" width="220" height="110" rx="12" fill="#0e1420" stroke="#60a5fa" stroke-width="1.6"/>
    <text x="310" y="162" font-size="24">🛠️</text>
