    <rect x="40" y="270" width="720" height="130" rx="12" fill="#050912" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="65" cy="292" r="6" fill="#f87171"/>
    <circle cx="85" cy="292" r="6" fill="#fbbf24"/>
    <circle cx="105" cy="292" r="6" fill="#34d399"/>
    <text x="60" y="322" font-family="monospace" font-size="14" fill="#34d399">$ nmap -sV target.htb</text>
    <text x="60" y="344" font-family="monospace" font-size="14" fill="#93c5fd">$ gobuster dir -u http://web/ -w wordlist</text>
