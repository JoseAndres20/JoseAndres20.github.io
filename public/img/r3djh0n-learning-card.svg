    <text x="310" y="206" font-size="11" fill="#93c5fd">nmap • gobuster • hydra</text>
    <text x="310" y="222" font-size="11" fill="#93c5fd">burp • sql • xss • john</text>
    <rect x="540" y="130" width="220" height="110" rx="12" fill="#0e1420" stroke="#34d399" stroke-width="1.6"/>
    <text x="560" y="162" font-size="24">📝</text>
    <text x="560" y="186" font-size="14" font-weight="bold" fill="#fff">notes + scripts</text>
    <text x="560" y="206" font-size="11" fill="#a7f3d0">markdown • obsidian</text>
